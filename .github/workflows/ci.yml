name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege: these jobs only read the repository.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
    - uses: actions/checkout@v4
      with:
        # The checkout token is not needed after this step; leaving it in the
        # git config would expose it to every later step.
        persist-credentials: false

    # Frontend CI
    - name: Use Node.js ${{ matrix.node-version }} for Frontend
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Frontend Dependencies
      run: npm install

    - name: Build Frontend
      run: npm run build

    # Backend CI
    - name: Use Node.js ${{ matrix.node-version }} for Backend
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: api/package-lock.json

    - name: Install Backend Dependencies
      working-directory: ./api
      run: npm ci

    - name: Build Backend
      working-directory: ./api
      run: npm run build

  audit:
    runs-on: ubuntu-latest
    strategy:
      # Report every failing workspace, not just the first.
      fail-fast: false
      matrix:
        workspace: [".", "api"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      # Nothing checked this before, so vulnerable transitive dependencies
      # could reach production unnoticed.
      - name: npm audit (${{ matrix.workspace }})
        working-directory: ${{ matrix.workspace }}
        run: npm audit --audit-level=high
